version: 1
disable_existing_loggers: false
formatters:
  structured:
    format: '{"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "request_id": "%(request_id)s", "stage": "%(stage)s", "outcome": "%(outcome)s", "message": "%(message)s"}'
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: structured
    stream: ext://sys.stdout
loggers:
  nexus:
    level: INFO
    handlers: [console]
    propagate: false
root:
  level: INFO
  handlers: [console]
